name: Daily Flight Price Tracker

on:
  # 每天 UTC 00:00 執行（台北時間 08:00）
  schedule:
    - cron: '0 0 * * *'
  
  # 允許手動觸發
  workflow_dispatch:

jobs:
  track-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run price tracker
        env:
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
      
      - name: Upload price data
        uses: actions/upload-artifact@v4
        with:
          name: price-data-${{ github.run_number }}
          path: data/prices.csv
          retention-days: 90
      
      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/prices.csv
          git diff --staged --quiet || git commit -m "📊 Update flight prices - $(date +'%Y-%m-%d')"
          git push
